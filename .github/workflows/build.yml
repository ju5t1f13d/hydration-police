name: Build Hydration Police

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npx electron-builder --win --publish never

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Hydration-Police-Windows
          path: dist/*

  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Mac
        run: npx electron-builder --mac --publish never

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: Hydration-Police-Mac
          path: dist/*